name: Migrate Telegram Android to Vendored Source

on:
  workflow_dispatch:
    branches:
      - master
    paths:
      - ".github/workflows/migrate-telegram-vendored.yml"
      - ".migration/run-vendoring"

permissions:
  contents: write

concurrency:
  group: vendor-telegram-source-migration-master
  cancel-in-progress: false

jobs:
  vendor-source:
    name: Vendor pinned Telegram Android source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Tele-ß repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Require master and explicit migration trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "master" || {
            echo "::error::Vendoring migration must run from master."
            exit 1
          }
          test -f .migration/run-vendoring || {
            echo "::error::Explicit migration trigger file is missing."
            exit 1
          }

      - name: Fetch exact Telegram Android source revision
        shell: bash
        run: |
          set -euo pipefail
          git init _telegram-upstream
          git -C _telegram-upstream remote add origin https://github.com/TelegramOrg/Telegram-Android.git
          git -C _telegram-upstream fetch --depth=1 origin 3de37c8cfb039452be7398909461da6288babf15
          git -C _telegram-upstream checkout --detach FETCH_HEAD

      - name: Validate upstream snapshot and current legacy pointer
        shell: bash
        run: |
          set -euo pipefail
          expected="3de37c8cfb039452be7398909461da6288babf15"
          actual="$(git -C _telegram-upstream rev-parse HEAD)"
          test "$actual" = "$expected"
          test -f _telegram-upstream/gradlew
          test -d _telegram-upstream/TMessagesProj
          test -d _telegram-upstream/TMessagesProj_AppStandalone

          pointer="$(git ls-tree HEAD upstream/Telegram-Android | awk '{print $3}')"
          if [ -z "$pointer" ]; then
            pointer="$(git ls-tree HEAD _telegram-upstream | awk '{print $3}')"
          fi
          if [ -n "$pointer" ]; then
            test "$pointer" = "$expected"
          fi
          echo "Validated Telegram Android commit: $actual"

      - name: Vendor source into repository root and remove legacy gitlink
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitmodules' \
            --exclude='README.md' \
            --exclude='patches/' \
            --exclude='upstream/' \
            _telegram-upstream/ ./

          rm -rf _telegram-upstream
          git rm -f upstream/Telegram-Android 2>/dev/null || true
          git rm -f _telegram-upstream 2>/dev/null || true
          rm -f .gitmodules
          rmdir upstream 2>/dev/null || true

          printf '%s\n' '3de37c8cfb039452be7398909461da6288babf15' > UPSTREAM_TELEGRAM_COMMIT

          test -f gradlew
          test -f TMessagesProj/build.gradle
          test -d TMessagesProj_AppStandalone
          test ! -e .gitmodules
          test ! -e upstream/Telegram-Android

      - name: Verify vendored source and stage migration
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::A submodule gitlink is still present in the staged index."
            exit 1
          fi

          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Vendored source is already present and matches the pinned upstream snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Vendored source changes are staged."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push vendored source to master
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: vendor Telegram Android source into Tele-ß"
          git push origin HEAD:master

      - name: Publish migration summary
        shell: bash
        run: |
          {
            echo "## Telegram Android vendoring completed"
            echo
            echo "- Upstream repository: `TelegramOrg/Telegram-Android`"
            echo "- Pinned commit: `3de37c8cfb039452be7398909461da6288babf15`"
            echo "- Source location: repository root"
            echo "- Legacy submodule pointer: removed"
            echo "- Destination branch: master"
          } >> "$GITHUB_STEP_SUMMARY"
