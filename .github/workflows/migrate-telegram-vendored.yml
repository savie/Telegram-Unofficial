name: Migrate Telegram Android to Vendored Source

on:
  push:
    branches:
      - migration/vendor-telegram-full-source
    paths:
      - ".github/workflows/migrate-telegram-vendored.yml"
      - ".migration/run-vendoring"

permissions:
  contents: write

concurrency:
  group: vendor-telegram-source-migration-vendor-telegram-full-source
  cancel-in-progress: false

jobs:
  vendor-source:
    name: Vendor pinned Telegram Android source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Tele-ß repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require isolated migration branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "migration/vendor-telegram-full-source" || {
            echo "::error::Migration is restricted to the dedicated branch."
            exit 1
          }
          test -f .migration/run-vendoring || {
            echo "::error::Explicit migration trigger file is missing."
            exit 1
          }

      - name: Fetch exact Telegram Android submodule revision
        shell: bash
        run: |
          set -euo pipefail
          git init _telegram-upstream
          git -C _telegram-upstream remote add origin https://github.com/TelegramOrg/Telegram-Android.git
          git -C _telegram-upstream fetch --depth=1 origin 3de37c8cfb039452be7398909461da6288babf15
          git -C _telegram-upstream checkout --detach FETCH_HEAD

      - name: Validate upstream snapshot and current submodule pointer
        shell: bash
        run: |
          set -euo pipefail
          expected="3de37c8cfb039452be7398909461da6288babf15"
          actual="$(git -C _telegram-upstream rev-parse HEAD)"
          test "$actual" = "$expected"
          test -f _telegram-upstream/gradlew
          test -d _telegram-upstream/TMessagesProj
          test -d _telegram-upstream/TMessagesProj_AppStandalone

          pointer="$(git ls-tree HEAD upstream/Telegram-Android | awk '{print $3}')"
          test "$pointer" = "$expected"
          echo "Validated Telegram Android commit: $actual"

      - name: Vendor source into repository root and remove gitlink
        shell: bash
        run: |
          set -euo pipefail

          # Keep Tele-ß-owned repository metadata, workflows, patches, and README.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitmodules' \
            --exclude='README.md' \
            --exclude='patches/' \
            --exclude='upstream/' \
            _telegram-upstream/ ./

          # The fetched upstream checkout is temporary. Remove its nested .git
          # metadata and working directory so Git cannot stage it as a gitlink.
          rm -rf _telegram-upstream

          git rm -f upstream/Telegram-Android
          rm -f .gitmodules
          rmdir upstream 2>/dev/null || true

          printf '%s\n' '3de37c8cfb039452be7398909461da6288babf15' > UPSTREAM_TELEGRAM_COMMIT

          test -f gradlew
          test -f TMessagesProj/build.gradle
          test -d TMessagesProj_AppStandalone
          test ! -e .gitmodules
          test ! -e upstream/Telegram-Android

      - name: Verify vendored source and stage migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          # Preserve the upstream snapshot byte-for-byte; upstream contains
          # existing whitespace that must not be rewritten during vendoring.
          git diff --cached --stat
          test -n "$(git status --porcelain)"
          if git ls-files --error-unmatch upstream/Telegram-Android >/dev/null 2>&1; then
            echo "::error::The submodule gitlink is still present in the staged index."
            exit 1
          fi
          if ! git diff --cached --name-status -- upstream/Telegram-Android | grep -q '^D'; then
            echo "::error::The staged migration does not record deletion of the submodule gitlink."
            exit 1
          fi

      - name: Commit and push vendored source
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: vendor Telegram Android source into Tele-ß"
          git push origin "HEAD:$BRANCH"

      - name: Publish migration summary
        shell: bash
        run: |
          {
            echo "## Telegram Android vendoring completed"
            echo
            echo "- Upstream repository: `TelegramOrg/Telegram-Android`"
            echo "- Pinned commit: `3de37c8cfb039452be7398909461da6288babf15`"
            echo "- Source location: repository root"
            echo "- Submodule gitlink: removed from migration branch"
            echo "- Existing build workflow: intentionally unchanged"
            echo
            echo "Review the migration branch before opening or merging a pull request."
          } >> "$GITHUB_STEP_SUMMARY"
