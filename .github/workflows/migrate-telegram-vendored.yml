name: Migrate Telegram Android to Vendored Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-telegram-source-migration-master
  cancel-in-progress: false

jobs:
  vendor-source:
    name: Move Telegram source into upstream/
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tele-ß master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Validate migration request
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "master" || {
            echo "::error::Migration must run from master."
            exit 1
          }
          test -f .migration/run-vendoring || {
            echo "::error::Explicit migration trigger file is missing."
            exit 1
          }

      - name: Fetch current Telegram Android upstream recursively
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/telegram-upstream"
          rm -rf "$source"

          git clone --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            --jobs 8 \
            https://github.com/TelegramOrg/Telegram-Android.git "$source"

          git -C "$source" submodule sync --recursive
          git -C "$source" submodule update --init --recursive --jobs 8

          if git -C "$source" submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::An upstream submodule is not checked out at its recorded commit."
            exit 1
          fi

          revision="$(git -C "$source" rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Using current Telegram Android upstream HEAD: $revision"

          test -f "$source/gradlew"
          test -f "$source/TMessagesProj/build.gradle"
          test -d "$source/TMessagesProj_AppStandalone"
          test -f "$source/TMessagesProj_Modules/media/core_settings.gradle"

      - name: Move Telegram source from root into upstream/
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/telegram-upstream"
          destination="upstream"

          # Replace any previous vendored directory or submodule with a plain directory.
          git rm -rf --ignore-unmatch "$destination"
          rm -rf "$destination"
          mkdir -p "$destination"

          # Preserve Tele-ß-owned root paths; copy Telegram source as regular files.
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/' \
            --exclude='.gitmodules' \
            --exclude='.github/' \
            --exclude='.migration/' \
            --exclude='README.md' \
            --exclude='patches/' \
            --exclude='docs/' \
            "$source/" "$destination/"

          # Remove only root-level paths that belong to Telegram upstream.
          # The explicit Tele-ß paths above are never removed.
          while IFS= read -r -d '' entry; do
            name="$(basename "$entry")"
            case "$name" in
              .git|.github|.migration|README.md|patches|docs|.gitmodules)
                continue
                ;;
            esac
            rm -rf -- "./$name"
          done < <(find "$source" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.migration' \
            ! -name 'README.md' \
            ! -name 'patches' \
            ! -name 'docs' \
            ! -name '.gitmodules' -print0)

          # The upstream .gitmodules is metadata; vendored submodule contents are files.
          rm -f .gitmodules
          rm -rf "$source"

          test -f upstream/gradlew
          test -f upstream/TMessagesProj/build.gradle
          test -d upstream/TMessagesProj_AppStandalone
          test -f upstream/TMessagesProj_Modules/media/core_settings.gradle
          test -f .github/workflows/migrate-telegram-vendored.yml
          test -f .migration/run-vendoring
          test -d docs
          test -d patches
          test -f README.md
          test ! -e .gitmodules
          test ! -e gradlew
          test ! -e TMessagesProj
          test ! -e TMessagesProj_AppStandalone

      - name: Verify vendored layout and stage exact changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::A Git submodule gitlink remains. All upstream content must be regular files."
            exit 1
          fi

          test -f upstream/gradlew
          test -f upstream/TMessagesProj/build.gradle
          test -d upstream/TMessagesProj_AppStandalone
          test -f .github/workflows/migrate-telegram-vendored.yml
          test -f .migration/run-vendoring
          test -d docs
          test -d patches
          test -f README.md
          test ! -e .gitmodules
          test ! -e gradlew
          test ! -e TMessagesProj
          test ! -e TMessagesProj_AppStandalone

          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Repository already matches the vendored layout."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push migration to master
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: move Telegram source into upstream directory"
          git push origin HEAD:master

      - name: Publish migration summary
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          {
            echo "## Telegram Android source migration"
            echo
            echo "- Upstream: `TelegramOrg/Telegram-Android`"
            echo "- Upstream HEAD: `$UPSTREAM_REVISION`"
            echo "- Destination: `upstream/`"
            echo "- Telegram source previously at root: moved out of root"
            echo "- Stale files in vendored source: removed"
            echo "- Recursive upstream submodules: flattened into regular files"
            echo "- Tele-ß-owned root paths: preserved"
            echo "- Git submodule metadata: absent"
            echo "- Branch: `master`"
          } >> "$GITHUB_STEP_SUMMARY"
