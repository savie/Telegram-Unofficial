name: Migrate Telegram Android to Vendored Source

on:
  # One-time bootstrap only. Ongoing upstream updates belong to
  # sync-telegram-upstream.yml.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-telegram-source-migration-master
  cancel-in-progress: false

jobs:
  vendor-source:
    name: Vendor pinned Telegram Android source and submodules
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tele-ß repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Require master and explicit migration trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "master" || {
            echo "::error::Vendoring migration must run from master."
            exit 1
          }
          test -f .migration/run-vendoring || {
            echo "::error::Explicit migration trigger file is missing."
            exit 1
          }

      - name: Resolve pinned Telegram Android revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -s UPSTREAM_TELEGRAM_COMMIT || {
            echo "::error::UPSTREAM_TELEGRAM_COMMIT is missing or empty."
            exit 1
          }
          revision="$(tr -d '[:space:]' < UPSTREAM_TELEGRAM_COMMIT)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::UPSTREAM_TELEGRAM_COMMIT must contain a full commit SHA."
            exit 1
          }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Vendoring Telegram Android revision: $revision"

      - name: Fetch exact upstream source and every recursive submodule
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          git init _telegram-upstream
          git -C _telegram-upstream remote add origin https://github.com/TelegramOrg/Telegram-Android.git
          git -C _telegram-upstream fetch --depth=1 origin "$UPSTREAM_REVISION"
          git -C _telegram-upstream checkout --detach FETCH_HEAD

          actual="$(git -C _telegram-upstream rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_REVISION"

          git -C _telegram-upstream submodule sync --recursive
          git -C _telegram-upstream submodule update --init --recursive --jobs 8

          if git -C _telegram-upstream submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::At least one upstream submodule is not at its pinned commit."
            exit 1
          fi

          test -f _telegram-upstream/gradlew
          test -f _telegram-upstream/TMessagesProj/build.gradle
          test -d _telegram-upstream/TMessagesProj_AppStandalone
          test -f _telegram-upstream/TMessagesProj_Modules/media/core_settings.gradle

          echo "Fetched upstream commit $actual and initialized all recursive submodules."

      - name: Vendor upstream source and materialized submodule files
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='/.git/' \
            --exclude='.git' \
            --exclude='/.github/' \
            --exclude='/.migration/' \
            --exclude='/README.md' \
            --exclude='/patches/' \
            --exclude='/UPSTREAM_TELEGRAM_COMMIT' \
            --exclude='/upstream/' \
            _telegram-upstream/ ./

          # Retain .gitmodules as upstream provenance metadata. Its submodule
          # directories are copied as regular files, not Git gitlinks.
          if git ls-tree HEAD upstream/Telegram-Android | grep -q '^160000 '; then
            git rm -f upstream/Telegram-Android
          fi
          rmdir upstream 2>/dev/null || true
          rm -rf _telegram-upstream

          test -f gradlew
          test -f TMessagesProj/build.gradle
          test -d TMessagesProj_AppStandalone
          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -f .gitmodules

      - name: Verify vendored files are regular files and stage migration
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::A Git submodule gitlink remains. All Telegram submodule contents must be regular files."
            exit 1
          fi

          git cat-file -e ":TMessagesProj_Modules/media/core_settings.gradle"

          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Vendored source and submodule contents already match the pinned upstream snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Vendored source and submodule contents are staged."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push vendored source to master
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: vendor Telegram Android source and submodules"
          git push origin HEAD:master

      - name: Publish migration summary
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          {
            echo "## Telegram Android vendoring completed"
            echo
            echo "- Upstream repository: `TelegramOrg/Telegram-Android`"
            echo "- Pinned commit: `$UPSTREAM_REVISION`"
            echo "- Source location: repository root"
            echo "- Recursive submodules: initialized and flattened into regular files"
            echo "- Git submodule entries in Tele-ß: none"
            echo "- Upstream .gitmodules: retained as metadata"
            echo "- Destination branch: master"
          } >> "$GITHUB_STEP_SUMMARY"
