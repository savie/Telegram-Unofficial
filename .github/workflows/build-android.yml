name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout project configuration
        uses: actions/checkout@v5

      - name: Validate Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "::error::Set TELEGRAM_API_ID in repository secrets."; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "::error::Set TELEGRAM_API_HASH in repository secrets."; exit 1; }
          case "$TELEGRAM_API_ID" in *[!0-9]*|'') echo "::error::TELEGRAM_API_ID must be numeric."; exit 1;; esac

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          git config --global advice.defaultBranchName false

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch Telegram Android upstream
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/TelegramOrg/Telegram-Android.git upstream
          test -f upstream/gradlew
          test -f upstream/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic


      - name: Configure project API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("upstream/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text()
          app_id = os.environ["TELEGRAM_API_ID"]
          app_hash = os.environ["TELEGRAM_API_HASH"]
          source, n1 = re.subn(r"public static int APP_ID = [0-9]+;", f"public static int APP_ID = {app_id};", source, count=1)
          source, n2 = re.subn(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{app_hash}";', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("BuildVars.java layout changed; refusing to patch credentials.")
          path.write_text(source)
          PY


      - name: Apply Tele-beta branding and application ID
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream")
          # Application ID is set via upstream Gradle property and the standalone
          # module appends ".web" for the standalone variant.
          props = root / "gradle.properties"
          data = props.read_text()
          data, count = re.subn(r"(?m)^APP_PACKAGE=.*$", "APP_PACKAGE=org.telebeta.messenger", data)
          if count != 1:
              raise SystemExit("Could not locate APP_PACKAGE in gradle.properties")
          props.write_text(data)

          # The standalone manifest supplies the launcher label.
          manifest = root / "TMessagesProj/config/release/AndroidManifest_standalone.xml"
          xml = manifest.read_text()
          xml2, count = re.subn(r'android:label="[^"]*"', 'android:label="Tele-ß"', xml, count=1)
          if count != 1:
              raise SystemExit("Could not patch standalone launcher label")
          manifest.write_text(xml2)

          # Fork namespace for application/library code; keep upstream Java
          # package paths unchanged. Android namespace is independent of source packages.
          module = root / "TMessagesProj/build.gradle"
          gradle = module.read_text()
          gradle2, count = re.subn(r"namespace ['\"]org\.telegram\.messenger['\"]", "namespace 'org.telebeta.messenger'", gradle, count=1)
          if count != 1:
              raise SystemExit("Could not patch TMessagesProj namespace")
          module.write_text(gradle2)

          standalone = root / "TMessagesProj_AppStandalone/build.gradle"
          gradle = standalone.read_text()
          gradle2, count = re.subn(r"namespace ['\"]org\.telegram\.messenger\.web['\"]", "namespace 'org.telebeta.messenger.web'", gradle, count=1)
          if count != 1:
              raise SystemExit("Could not patch standalone namespace")

          # The upstream standalone buildType adds applicationIdSuffix ".web".
          # Override it with an empty suffix: final applicationId must be exact.
          gradle2, count = re.subn(
              r'(standalone\s*\{[\s\S]*?applicationIdSuffix\s+)"\.web"',
              r'\1""',
              gradle2,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not remove standalone .web applicationIdSuffix")
          # Firebase config must belong to the exact Tele-beta application ID.
          # If the user has not supplied one yet, allow the APK build to proceed
          # without generating Firebase resources (FCM remains unconfigured).
          gradle2 += '\n\ngoogleServices {\n    missingGoogleServicesStrategy = "IGNORE"\n}\n'
          standalone.write_text(gradle2)

          import os
          firebase_json = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
          if firebase_json:
              import json
              config = json.loads(firebase_json)
              clients = config.get("client", [])
              if not any(client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.telebeta.messenger" for client in clients):
                  raise SystemExit("FIREBASE_GOOGLE_SERVICES_JSON has no client for org.telebeta.messenger")
              (root / "TMessagesProj_AppStandalone/google-services.json").write_text(json.dumps(config, indent=2) + "\n")
          else:
              (root / "TMessagesProj_AppStandalone/google-services.json").unlink(missing_ok=True)
          PY

      - name: Build standalone APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: telegram-unofficial-android-apk
          path: upstream/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14