name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-android.yml"
      - "UPSTREAM_TELEGRAM_COMMIT"
      - "gradlew"
      - "gradle.properties"
      - "TMessagesProj/**"
      - "TMessagesProj_AppStandalone/**"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tele-ß source
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1
          submodules: false

      - name: Validate root-level vendored Telegram source
        shell: bash
        run: |
          set -euo pipefail
          test -s UPSTREAM_TELEGRAM_COMMIT
          revision="$(tr -d '[:space:]' < UPSTREAM_TELEGRAM_COMMIT)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::UPSTREAM_TELEGRAM_COMMIT must contain a full commit SHA."
            exit 1
          }
          test -f gradlew
          test -f TMessagesProj/build.gradle
          test -f TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          test -d TMessagesProj_AppStandalone
          test ! -e .gitmodules
          test ! -e upstream/Telegram-Android
          test ! -e _telegram-upstream
          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::Vendored source must not contain Git submodules."
            exit 1
          fi
          echo "Building vendored Telegram source at $revision."

      - name: Validate Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_API_ID" || { echo "::error::Set TELEGRAM_API_ID in repository secrets."; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "::error::Set TELEGRAM_API_HASH in repository secrets."; exit 1; }
          case "$TELEGRAM_API_ID" in *[!0-9]*|'') echo "::error::TELEGRAM_API_ID must be numeric."; exit 1;; esac

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore C++ compilation cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-ndk27-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-ndk27-${{ runner.os }}-

      - name: Set up ccache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --version

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply Tele-ß patches
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEBETA_KEYSTORE_BASE64: ${{ secrets.TELEBETA_KEYSTORE_BASE64 }}
          TELEBETA_KEYSTORE_PASSWORD: ${{ secrets.TELEBETA_KEYSTORE_PASSWORD }}
          TELEBETA_KEY_ALIAS: ${{ secrets.TELEBETA_KEY_ALIAS }}
          TELEBETA_KEY_PASSWORD: ${{ secrets.TELEBETA_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/apply.py
          keytool -list -keystore TMessagesProj/config/release.keystore \
            -storepass "$TELEBETA_KEYSTORE_PASSWORD" -alias "$TELEBETA_KEY_ALIAS" >/dev/null
          echo "Tele-ß signing certificate verified."

      - name: Build standalone APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --parallel \
            :TMessagesProj_AppStandalone:processAfatStandaloneGoogleServices \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Show build cache statistics
        if: always()
        shell: bash
        run: |
          echo "===== CCACHE ====="
          ccache --show-stats || true
          ccache --show-config || true
          echo "===== GRADLE TASK CACHE SUMMARY ====="
          find . -path '*/build/*' -prune -o -name 'build-scan-data' -print | head -20 || true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tele-ß_${{ github.run_number }}
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          if-no-files-found: error
          retention-days: 14
