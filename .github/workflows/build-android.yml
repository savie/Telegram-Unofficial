name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-android.yml"
      - ".gitmodules"
      - "upstream/Telegram-Android"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tele-beta configuration
        uses: actions/checkout@v5

      - name: Resolve pinned Telegram upstream revision
        id: upstream
        run: |
          sha="$(git ls-tree HEAD upstream/Telegram-Android | awk '{print $3}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned Telegram Android revision: $sha"

      - name: Restore Telegram submodule source cache
        uses: actions/cache@v4
        with:
          path: |
            upstream/Telegram-Android
            .git/modules/upstream/Telegram-Android
          key: telegram-android-${{ steps.upstream.outputs.sha }}
          restore-keys: |
            telegram-android-

      - name: Initialize pinned Telegram submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f upstream/Telegram-Android/gradlew
          test -f upstream/Telegram-Android/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          actual="$(git -C upstream/Telegram-Android rev-parse HEAD)"
          test "$actual" = "${{ steps.upstream.outputs.sha }}"
          echo "Telegram source ready at $actual"

      - name: Validate Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "::error::Set TELEGRAM_API_ID in repository secrets."; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "::error::Set TELEGRAM_API_HASH in repository secrets."; exit 1; }
          case "$TELEGRAM_API_ID" in *[!0-9]*|'') echo "::error::TELEGRAM_API_ID must be numeric."; exit 1;; esac

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          git config --global advice.defaultBranchName false

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle and restore caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Apply Tele-beta patches
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEBETA_KEYSTORE_BASE64: ${{ secrets.TELEBETA_KEYSTORE_BASE64 }}
          TELEBETA_KEYSTORE_PASSWORD: ${{ secrets.TELEBETA_KEYSTORE_PASSWORD }}
          TELEBETA_KEY_ALIAS: ${{ secrets.TELEBETA_KEY_ALIAS }}
          TELEBETA_KEY_PASSWORD: ${{ secrets.TELEBETA_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          python3 patches/apply.py
          keytool -list -keystore upstream/Telegram-Android/TMessagesProj/config/release.keystore \
            -storepass "$TELEBETA_KEYSTORE_PASSWORD" -alias "$TELEBETA_KEY_ALIAS" >/dev/null
          echo "Tele-beta signing certificate verified."

      - name: Build standalone APK
        working-directory: upstream/Telegram-Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_AppStandalone:processAfatStandaloneGoogleServices
          ./gradlew --no-daemon --build-cache --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: tele-ß_${{ format('{0:02d}', github.run_number) }}
          path: upstream/Telegram-Android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
