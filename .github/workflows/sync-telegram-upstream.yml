name: Sync Telegram Android Upstream

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync-telegram-upstream.yml"
      - "UPSTREAM_TELEGRAM_COMMIT"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-upstream-sync-master
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync Telegram source inside upstream/
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Tele-ß master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -d upstream || {
            echo "::error::The vendored Telegram source directory upstream/ does not exist. Run the migration workflow first."
            exit 1
          }
          test -f .github/workflows/sync-telegram-upstream.yml
          test -f README.md
          test -d docs
          test -d patches

      - name: Resolve current Telegram Android upstream HEAD
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          repo="https://github.com/TelegramOrg/Telegram-Android.git"
          revision="$(git ls-remote "$repo" HEAD | awk 'NR==1 {print $1}')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve a valid Telegram Android upstream HEAD."
            exit 1
          }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Current Telegram Android upstream HEAD: $revision"

      - name: Read previous upstream revision when available
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ -s UPSTREAM_TELEGRAM_COMMIT ]; then
            current="$(tr -d '[:space:]' < UPSTREAM_TELEGRAM_COMMIT)"
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::UPSTREAM_TELEGRAM_COMMIT exists but does not contain a full commit SHA."
              exit 1
            }
          else
            current=""
            echo "No revision marker exists yet; this run will establish the baseline."
          fi
          echo "revision=$current" >> "$GITHUB_OUTPUT"
          echo "Previous upstream revision: ${current:-not recorded}"

      - name: Skip download when upstream is unchanged
        if: steps.upstream.outputs.revision == steps.baseline.outputs.revision
        shell: bash
        run: |
          echo "Telegram Android upstream is unchanged. The vendored source was not downloaded."

      - name: Fetch current upstream and all recursive submodules
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/telegram-upstream"
          rm -rf "$source"

          git clone --no-checkout https://github.com/TelegramOrg/Telegram-Android.git "$source"
          git -C "$source" fetch --depth=1 origin "$UPSTREAM_REVISION"
          git -C "$source" checkout --detach FETCH_HEAD

          actual="$(git -C "$source" rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_REVISION"

          git -C "$source" submodule sync --recursive
          git -C "$source" submodule update --init --recursive --jobs 8

          if git -C "$source" submodule status --recursive | grep -E '^[+-U]'; then
            echo "::error::At least one upstream submodule is not checked out at its recorded commit."
            exit 1
          fi

          test -f "$source/gradlew"
          test -f "$source/TMessagesProj/build.gradle"
          test -d "$source/TMessagesProj_AppStandalone"
          test -f "$source/TMessagesProj_Modules/media/core_settings.gradle"
          echo "Fetched Telegram Android $actual and all recursive submodules."

      - name: Replace only upstream/ with flattened Telegram source
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/telegram-upstream"
          destination="$GITHUB_WORKSPACE/upstream"

          # This sync is scoped exclusively to upstream/. It never rsyncs to
          # the repository root and never deletes Tele-ß-owned root files.
          mkdir -p "$destination"
          rsync -a --delete             --exclude='.git'             --exclude='.git/'             --exclude='.gitmodules'             "$source/" "$destination/"

          # Git metadata and submodule manifests are not required for builds.
          find "$destination" -name .git -type d -prune -exec rm -rf {} +
          find "$destination" -name .git -type f -delete
          find "$destination" -name .gitmodules -type f -delete
          printf '%s\n' "$UPSTREAM_REVISION" > UPSTREAM_TELEGRAM_COMMIT
          rm -rf "$source"

          test -f upstream/gradlew
          test -f upstream/TMessagesProj/build.gradle
          test -d upstream/TMessagesProj_AppStandalone
          test -f upstream/TMessagesProj_Modules/media/core_settings.gradle
          test -f .github/workflows/sync-telegram-upstream.yml
          test -f README.md
          test -d docs
          test -d patches
          test ! -e .gitmodules

      - name: Verify vendored layout and stage changes
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::A Git submodule gitlink remains. All upstream content must be regular files."
            exit 1
          fi

          test -f upstream/gradlew
          test -f upstream/TMessagesProj/build.gradle
          test -d upstream/TMessagesProj_AppStandalone
          test -f upstream/TMessagesProj_Modules/media/core_settings.gradle
          test -s UPSTREAM_TELEGRAM_COMMIT
          test -f .github/workflows/sync-telegram-upstream.yml
          test -f README.md
          test -d docs
          test -d patches
          test ! -e .gitmodules

          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No file changes after syncing the current upstream snapshot."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit upstream update to master
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync Telegram source under upstream"
          git push origin HEAD:master

      - name: Publish sync summary
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
          CURRENT_REVISION: ${{ steps.baseline.outputs.revision }}
        run: |
          {
            echo "## Telegram Android upstream sync"
            echo
            echo "- Previous revision: ${CURRENT_REVISION:-not recorded}"
            echo "- Current upstream HEAD: `$UPSTREAM_REVISION`"
            echo "- Destination: `upstream/` only"
            echo "- Root Tele-ß files and directories: preserved"
            echo "- Recursive upstream submodules: flattened into regular files"
            echo "- Git metadata and .gitmodules manifests: excluded from vendored source"
            echo "- Git submodule entries: none"
          } >> "$GITHUB_STEP_SUMMARY"
