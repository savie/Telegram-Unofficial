name: Sync Telegram Android Upstream

on:
  push:
    branches:
      - migration/vendor-telegram-full-source
    paths:
      - ".github/workflows/sync-telegram-upstream.yml"
      
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: telegram-upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Prepare Telegram upstream update
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: migration/vendor-telegram-full-source
          fetch-depth: 0

      - name: Resolve current upstream revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          repo="https://github.com/TelegramOrg/Telegram-Android.git"
          revision="$(git ls-remote "$repo" HEAD | awk 'NR==1 {print $1}')"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Latest upstream revision: $revision"

      - name: Read current pinned revision
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f UPSTREAM_TELEGRAM_COMMIT
          current="$(tr -d '[:space:]' < UPSTREAM_TELEGRAM_COMMIT)"
          test -n "$current"
          echo "revision=$current" >> "$GITHUB_OUTPUT"
          echo "Current vendored revision: $current"

      - name: Stop when upstream has no new commit
        if: steps.upstream.outputs.revision == steps.baseline.outputs.revision
        run: echo "Telegram upstream is already synchronized."

      - name: Fetch latest upstream snapshot
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          git init /tmp/telegram-upstream
          git -C /tmp/telegram-upstream remote add origin https://github.com/TelegramOrg/Telegram-Android.git
          git -C /tmp/telegram-upstream fetch --depth=1 origin "$UPSTREAM_REVISION"
          git -C /tmp/telegram-upstream checkout --detach FETCH_HEAD
          actual="$(git -C /tmp/telegram-upstream rev-parse HEAD)"
          test "$actual" = "$UPSTREAM_REVISION"
          test -f /tmp/telegram-upstream/gradlew
          test -d /tmp/telegram-upstream/TMessagesProj
          test -d /tmp/telegram-upstream/TMessagesProj_AppStandalone

      - name: Sync upstream files and preserve Tele-ß files
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        shell: bash
        env:
          UPSTREAM_REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.migration/' \
            --exclude='README.md' \
            --exclude='patches/' \
            /tmp/telegram-upstream/ ./

          rm -rf .gitmodules upstream/Telegram-Android _telegram-upstream
          printf '%s\\n' "$UPSTREAM_REVISION" > UPSTREAM_TELEGRAM_COMMIT

          test -f gradlew
          test -d TMessagesProj
          test -d TMessagesProj_AppStandalone
          test ! -e .gitmodules
          test ! -e upstream/Telegram-Android
          test ! -e _telegram-upstream

      - name: Verify vendored snapshot and stage changes
        if: steps.upstream.outputs.revision != steps.baseline.outputs.revision
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git ls-files --stage | awk '$1 == "160000" { print; found=1 } END { exit found ? 0 : 1 }'; then
            echo "::error::Upstream sync must never introduce a submodule gitlink."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No source changes after synchronization."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update upstream sync pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: migration/vendor-telegram-full-source
          branch: automation/telegram-upstream-sync
          delete-branch: true
          commit-message: "build: sync Telegram Android upstream"
          title: "build: sync Telegram Android upstream"
          body: |
            ## Telegram Android upstream sync

            - Upstream: https://github.com/TelegramOrg/Telegram-Android
            - Previous commit: ${{ steps.baseline.outputs.revision }}
            - Proposed commit: ${{ steps.upstream.outputs.revision }}

            Review the upstream changes and CI results before merging.
            No automatic merge is performed.
